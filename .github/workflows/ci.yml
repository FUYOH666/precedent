name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv python install "$UV_PYTHON"
      - run: ./scripts/verify_all.sh

  generated-in-sync:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync
      - name: Regenerate numbers, figures and schemas
        run: |
          uv run python scripts/results.py collections-conduct > /dev/null
          uv run --with "fonttools[woff]==4.68.0" python scripts/figures.py > /dev/null
          uv run python scripts/schemas.py > /dev/null
          # benchmark tables, rebuilt from the recorded judge cassettes (no model call)
          for judge in google/gemma-4-26b-a4b-it deepseek/deepseek-v4.1-flash-1017; do
            JUDGE_MODEL="$judge" uv run python benchmarks/correction_stream/run.py analyze > /dev/null
          done
      - name: Committed artifacts match the code
        run: git diff --exit-code -- docs/results docs/assets src/precedent/schemas benchmarks/correction_stream/results

  package:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv build
      - run: uvx twine check --strict dist/*
      - name: The built wheel runs the demo in a clean environment
        run: |
          uv venv "$RUNNER_TEMP/wheel"
          uv pip install --python "$RUNNER_TEMP/wheel" dist/*.whl
          "$RUNNER_TEMP/wheel/bin/precedent-llm" demo --out "$RUNNER_TEMP/demo"

  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uvx zizmor --persona regular .github/workflows
